<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DZ SOCIAL</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f0f2f5;color:#172033}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #ddd;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{font-size:25px;font-weight:900;color:#1877f2}.search{flex:1;max-width:420px;background:#f0f2f5;border:0;border-radius:22px;padding:12px 16px;outline:0}
main{max-width:700px;margin:20px auto;padding:0 12px}.card{background:#fff;border-radius:14px;margin-bottom:16px;box-shadow:0 1px 4px #0001;overflow:hidden}
.composer{padding:14px}.composer textarea{width:100%;border:0;background:#f0f2f5;border-radius:12px;padding:13px;resize:none;outline:0;font-size:15px}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.btn{border:0;border-radius:9px;padding:10px 18px;font-weight:bold;cursor:pointer}
.primary{background:#1877f2;color:#fff}.post{padding:16px}.user{display:flex;align-items:center;gap:10px}.avatar{width:42px;height:42px;border-radius:50%;background:#1877f2;color:#fff;display:grid;place-items:center;font-weight:bold}
.name{font-weight:bold}.time{font-size:12px;color:#777}.text{font-size:16px;line-height:1.7;margin:14px 0}
.actions{display:flex;border-top:1px solid #eee;padding-top:8px;gap:8px}.action{flex:1;background:transparent;border:0;padding:10px;border-radius:8px;cursor:pointer;font-size:15px}.action:hover{background:#f0f2f5}
.liked{color:#1877f2;font-weight:bold}.empty{text-align:center;padding:35px;color:#777}
footer{text-align:center;color:#888;padding:20px;font-size:12px}
</style>
</head>
<body>
<header>
  <div class="logo">DZ SOCIAL 🇩🇿</div>
  <input id="search" class="search" placeholder="ابحث عن منشور...">
</header>

<main>
  <section class="card composer">
    <div class="user">
      <div class="avatar">م</div>
      <div><div class="name">مهدي</div><div class="time">نشر الآن</div></div>
    </div>
    <textarea id="postText" rows="3" placeholder="واش حاب تنشر اليوم؟"></textarea>
    <div class="row">
      <span>🌐 منشور عام</span>
      <button class="btn primary" onclick="addPost()">نشر</button>
    </div>
  </section>

  <section id="feed"></section>
</main>

<footer>DZ SOCIAL — النسخة التجريبية الأولى</footer>

<script>
const defaultPosts=[
 {id:1,name:"مهدي",text:"مرحبا بكم في DZ SOCIAL 🇩🇿🔥",likes:3,liked:false,time:"منذ قليل"},
 {id:2,name:"DZ Community",text:"هنا نقدروا نبنيو شبكة اجتماعية جزائرية رائعة 🚀",likes:7,liked:false,time:"منذ ساعة"}
];
let posts=JSON.parse(localStorage.getItem("dz_posts")||"null")||defaultPosts;

function save(){localStorage.setItem("dz_posts",JSON.stringify(posts))}
function render(filter=""){
 const feed=document.getElementById("feed");
 const list=posts.filter(p=>p.text.toLowerCase().includes(filter.toLowerCase()));
 if(!list.length){feed.innerHTML='<div class="card empty">ما لقيناش منشورات 🔎</div>';return}
 feed.innerHTML=list.map(p=>`
 <article class="card post">
  <div class="user"><div class="avatar">${p.name[0]}</div>
   <div><div class="name">${escapeHtml(p.name)}</div><div class="time">${p.time}</div></div>
  </div>
  <div class="text">${escapeHtml(p.text).replace(/\n/g,"<br>")}</div>
  <div class="actions">
   <button class="action ${p.liked?'liked':''}" onclick="likePost(${p.id})">👍 إعجاب ${p.likes}</button>
   <button class="action" onclick="commentPost(${p.id})">💬 تعليق</button>
   <button class="action" onclick="sharePost(${p.id})">↗️ مشاركة</button>
  </div>
 </article>`).join("");
}
function addPost(){
 const box=document.getElementById("postText"),text=box.value.trim();
 if(!text)return alert("اكتب حاجة قبل النشر 🙂");
 posts.unshift({id:Date.now(),name:"مهدي",text,likes:0,liked:false,time:"الآن"});
 box.value="";save();render(document.getElementById("search").value);
}
function likePost(id){const p=posts.find(x=>x.id===id);if(!p)return;p.liked=!p.liked;p.likes+=p.liked?1:-1;save();render(document.getElementById("search").value)}
function commentPost(id){const p=posts.find(x=>x.id===id);const c=prompt("اكتب تعليقك:");if(c&&c.trim())alert("تمت إضافة التعليق تجريبياً على: "+p.text)}
function sharePost(id){const p=posts.find(x=>x.id===id);navigator.clipboard?.writeText(p.text);alert("تم نسخ نص المنشور للمشاركة 📋")}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
document.getElementById("search").addEventListener("input",e=>render(e.target.value));
render();
</script>
</body>
</html>
